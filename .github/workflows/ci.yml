name: governed-access-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kastle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kastle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kastle_test
      JWT_ISSUER: kastle-ci
      JWT_AUDIENCE: kastle-ci-operators
      CORS_ORIGINS: https://access.example.test
      BACKEND_HOST: 127.0.0.1
      BACKEND_PORT: 4002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Generate ephemeral test secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Reject tracked secrets
        run: test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)"
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Apply and repeat migrations
        working-directory: backend
        run: |
          npm run db:migrate
          npm run db:migrate
          ../scripts/verify-schema-controls.sh
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=low
        working-directory: backend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: docker build -t kastle-governed:${{ github.sha }} .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
